name: Compilar APK Android Gluon

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java y GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Instalar Maven 3.8.8
      run: |
        wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
        tar -xzf apache-maven-3.8.8-bin.tar.gz
        echo "$PWD/apache-maven-3.8.8/bin" >> $GITHUB_PATH

    - name: Compilar APK con GluonFX
      run: mvn gluonfx:build gluonfx:package -Dgluonfx.target=aarch64-android -Dgluonfx.graalvmHome=$JAVA_HOME

    - name: Guardar ejecutable APK
      uses: actions/upload-artifact@v4
      with:
        name: CasoPracCelular1-APK
        path: target/gluonfx/aarch64-android/gvm/*.apk