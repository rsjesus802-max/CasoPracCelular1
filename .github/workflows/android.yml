name: Compilar APK Android Gluon

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar GraalVM oficial de Gluon
      uses: gluonhq/setup-graalvm@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Compilar y empaquetar APK
      run: mvn gluonfx:build gluonfx:package

    - name: Guardar ejecutable APK
      uses: actions/upload-artifact@v4
      with:
        name: CasoPracCelular1-APK
        path: target/gluonfx/aarch64-android/gvm/*.apk