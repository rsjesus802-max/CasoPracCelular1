name: Compilar APK Android Gluon

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar GraalVM oficial de Gluon (Java 17)
      uses: gluonhq/setup-graalvm@master
      with:
        graalvm: '22.1.0.1-Final'
        jdk: 'java17'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Instalar librerias de sistema necesarias
      run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl1-mesa-dev libgtk-3-dev libpango1.0-dev libxtst-dev

    - name: Instalar Maven 3.8.8
      run: |
        wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
        tar -xzf apache-maven-3.8.8-bin.tar.gz
        echo "$PWD/apache-maven-3.8.8/bin" >> $GITHUB_PATH

    - name: Compilar y empaquetar APK
      run: mvn clean gluonfx:build gluonfx:package

    - name: Mostrar registro detallado si falla la compilacion
      if: failure()
      run: |
        echo "=== MOSTRANDO LOGS DE ERROR DE GLUONFX ==="
        cat target/gluonfx/aarch64-android/gvm/log/*.log || true
        cat target/gluonfx/log/*.log || true

    - name: Guardar ejecutable APK
      uses: actions/upload-artifact@v4
      with:
        name: CasoPracCelular1-APK
        path: target/gluonfx/**/*.apk